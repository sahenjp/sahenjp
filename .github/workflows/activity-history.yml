name: Update activity history

on:
  workflow_dispatch:
  schedule:
    - cron: '23 0 * * *'
  push:
    paths:
      - '.github/workflows/activity-history.yml'

permissions:
  contents: write

concurrency:
  group: update-activity-history
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Render activity history
        uses: seijikohara/profile-cards-action@19ff3829169ccebf0a7f25dfd34c9e780aee1c23
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.repository_owner }}
          cards: lifetime
          output-dir: activity
          themes: light,dark
          commit: true
          commit-message: 'chore(profile): refresh activity history [skip ci]'
