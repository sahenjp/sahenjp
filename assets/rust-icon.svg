<svg version="1.1" height="106" width="106" viewBox="0 0 106 106" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<style>
  .rust-fill { fill: #D34516; }
  .rust-stroke { stroke: #D34516; }
  .rust-outline { fill: none; stroke: #D34516; opacity: .35; }
</style>
<defs>
  <clipPath id="r-ink-clip">
    <rect x="-42" y="24" width="84" height="0">
      <animate attributeName="y" values="24;24;-26;-26;24" keyTimes="0;.12;.72;.96;1" dur="4.8s" repeatCount="indefinite" calcMode="linear"/>
      <animate attributeName="height" values="0;0;50;50;0" keyTimes="0;.12;.72;.96;1" dur="4.8s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </clipPath>
</defs>
<g id="logo" transform="translate(53 53)">
  <path id="r-outline" class="rust-outline" transform="translate(.5 .5)" stroke-width="1.8" stroke-linejoin="round" d="M-9-15H4C12-15 12-7 4-7H-9ZM-40 22H0V11H-9V3H1C12 3 6 22 15 22H40V3H34V5C34 13 25 12 24 7C23 2 19-2 18-2C33-10 24-26 12-26H-35V-15H-25V11H-40Z"/>
  <g clip-path="url(#r-ink-clip)">
    <path id="r-fill" class="rust-fill rust-stroke" transform="translate(.5 .5)" stroke-width="1" stroke-linejoin="round" d="M-9-15H4C12-15 12-7 4-7H-9ZM-40 22H0V11H-9V3H1C12 3 6 22 15 22H40V3H34V5C34 13 25 12 24 7C23 2 19-2 18-2C33-10 24-26 12-26H-35V-15H-25V11H-40Z"/>
  </g>
  <g id="gear" mask="url(#holes)">
    <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite" calcMode="linear"/>
    <circle r="43" fill="none" class="rust-stroke" stroke-width="9"/>
    <g id="cogs">
      <polygon id="cog" class="rust-fill rust-stroke" stroke-width="3" stroke-linejoin="round" points="46,3 51,0 46,-3"/>
      <use xlink:href="#cog" transform="rotate(11.25)"/><use xlink:href="#cog" transform="rotate(22.5)"/><use xlink:href="#cog" transform="rotate(33.75)"/><use xlink:href="#cog" transform="rotate(45)"/><use xlink:href="#cog" transform="rotate(56.25)"/><use xlink:href="#cog" transform="rotate(67.5)"/><use xlink:href="#cog" transform="rotate(78.75)"/><use xlink:href="#cog" transform="rotate(90)"/><use xlink:href="#cog" transform="rotate(101.25)"/><use xlink:href="#cog" transform="rotate(112.5)"/><use xlink:href="#cog" transform="rotate(123.75)"/><use xlink:href="#cog" transform="rotate(135)"/><use xlink:href="#cog" transform="rotate(146.25)"/><use xlink:href="#cog" transform="rotate(157.5)"/><use xlink:href="#cog" transform="rotate(168.75)"/><use xlink:href="#cog" transform="rotate(180)"/><use xlink:href="#cog" transform="rotate(191.25)"/><use xlink:href="#cog" transform="rotate(202.5)"/><use xlink:href="#cog" transform="rotate(213.75)"/><use xlink:href="#cog" transform="rotate(225)"/><use xlink:href="#cog" transform="rotate(236.25)"/><use xlink:href="#cog" transform="rotate(247.5)"/><use xlink:href="#cog" transform="rotate(258.75)"/><use xlink:href="#cog" transform="rotate(270)"/><use xlink:href="#cog" transform="rotate(281.25)"/><use xlink:href="#cog" transform="rotate(292.5)"/><use xlink:href="#cog" transform="rotate(303.75)"/><use xlink:href="#cog" transform="rotate(315)"/><use xlink:href="#cog" transform="rotate(326.25)"/><use xlink:href="#cog" transform="rotate(337.5)"/><use xlink:href="#cog" transform="rotate(348.75)"/>
    </g>
    <g id="mounts">
      <polygon id="mount" class="rust-fill rust-stroke" stroke-width="6" stroke-linejoin="round" points="-7,-42 0,-35 7,-42"/>
      <use xlink:href="#mount" transform="rotate(72)"/><use xlink:href="#mount" transform="rotate(144)"/><use xlink:href="#mount" transform="rotate(216)"/><use xlink:href="#mount" transform="rotate(288)"/>
    </g>
  </g>
  <mask id="holes">
    <rect x="-60" y="-60" width="120" height="120" fill="white"/>
    <circle id="hole" cy="-40" r="3"/>
    <use xlink:href="#hole" transform="rotate(72)"/><use xlink:href="#hole" transform="rotate(144)"/><use xlink:href="#hole" transform="rotate(216)"/><use xlink:href="#hole" transform="rotate(288)"/>
  </mask>
</g>
</svg>